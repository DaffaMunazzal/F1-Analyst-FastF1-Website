<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="dashboard-header">
        <h3 class="dashboard-title">F1 Analytics</h3>
        <p class="dashboard-subtitle">For Race Data</p>
    </header>

    <main id="driver-board" class="driver-grid">
        <!-- Driver cards will be injected here by JavaScript -->
    </main>

    <section class="chart-section">
        <h2>Pace Comparison (Top 3 Finishers)</h2>
        <figure class="chart-container">
            <canvas id="lapChart"></canvas>
            <figcaption>Grafik fluktuasi waktu putaran (dalam detik) pada GP Australia 2025.</figcaption>
        </figure>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
